; ============================================================
;  pytest 配置（V13.7）
; ------------------------------------------------------------
;  ★ V13.7 起 pytest 真的能收集到测试了（旧版 addopts = --ignore=core/tests
;    把唯一的测试目录整个排除，pytest --collect-only 永远 "no tests collected"）。
;
;  收集方式：只收集三个 test_all_* 入口函数（见各测试文件末尾），
;    它们内部调用自带的 main_test()。core/tests 里的 test_read(sav) /
;    test_write_roundtrip(sav, tmp) 是带参数的内部辅助函数，直接被 pytest
;    收集会报 "fixture not found"（V12.3 起的老问题）——所以用 python_functions
;    精确圈定收集面，而不是全局 ignore。
;
;  两种用法都支持：
;      pytest                     收集并运行三条回归（默认：非严格基准模式）
;      python core\tests\xxx.py   直接运行（可加 .sav 路径与 --strict-baseline）
;
;  注意：
;    · Node 测试（test_chal_writeback.js / test_full_user_flow.js）不在 pytest
;      收集范围内，用 python core\main.py --selftest 或直接 node 运行。
;    · --strict-baseline 只在直接运行脚本时有效（朝向 0~360°、容量 14/10/6 等
;      基准档数值断言）；pytest 默认只做结构性校验，换任何存档都能跑。
;    · 测试只在临时目录里写存档副本，根目录 game_data.sav 全程只读。
; ============================================================

[pytest]
testpaths = core/tests
norecursedirs = .venv backups editor core/BotW-Save-Editor __pycache__ .git
python_files = test_*.py
python_functions = test_all_*
; 不生成 .pytest_cache（保持项目根干净），断言改写不受影响
addopts = -p no:cacheprovider
